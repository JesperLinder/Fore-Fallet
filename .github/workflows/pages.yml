# Bygger spelet och publicerar det på GitHub Pages vid varje push till main.
# Spelet hamnar på https://<ägare>.github.io/<repo>/ – base-sökvägen sätts från repots namn.
name: Publicera på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # gör att man kan köra den för hand under Actions-fliken

permissions:
  contents: read
  pages: write
  id-token: write

# Bara en publicering åt gången; en ny push avbryter inte en publicering som redan pågår.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typkontroll + bygge. --base gör att alla sökvägar pekar på /<repo>/.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicering.outputs.page_url }}
    steps:
      - id: publicering
        uses: actions/deploy-pages@v4
