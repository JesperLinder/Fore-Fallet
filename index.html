<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0F2827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Före fallet</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-1024.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Typsnitt: byts mot ABC Arizona senare. Ändra då även src/config/theme.ts. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />
    <style>
      html, body { margin: 0; height: 100%; background: #0F2827; overflow: hidden; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Marginalen för klocka/notch och hemindikator ligger på #ram. Phaser mäter #spel inklusive padding,
         så #spel får ingen egen padding – annars blir spelet för högt och nederkanten klipps av. */
      #ram { position: fixed; inset: 0; height: 100vh; height: 100dvh; display: flex;
             padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
             box-sizing: border-box; }
      #spel { flex: 1; min-width: 0; min-height: 0; position: relative; }
      /* Osynliga element som tvingar webbläsaren att ladda typsnitten innan spelet ritar text. */
      .fontladdning { position: absolute; left: -9999px; visibility: hidden; }
    </style>
  </head>
  <body>
    <div class="fontladdning" style="font-family: 'Newsreader'">Aa</div>
    <div class="fontladdning" style="font-family: 'Newsreader'; font-style: italic">Aa</div>
    <div class="fontladdning" style="font-family: 'Instrument Sans'">Aa</div>
    <div id="ram"><div id="spel"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
